<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>스케치</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1c1c1e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #canvasWrap {
    flex: 1; position: relative; background: #3a3a3c;
    overflow: auto;
  }
  canvas {
    position: absolute; top: 0; left: 0; touch-action: none;
    transform-origin: 0 0;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }
  #brushRow, #toolbar, #zoomRow {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #2c2c2e;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  #brushRow { padding-bottom: 4px; border-bottom: 1px solid #3a3a3c; }
  #zoomRow { padding-top: 4px; border-top: 1px solid #3a3a3c; justify-content: center; }
  .colorDot {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid transparent; flex-shrink: 0; cursor: pointer;
  }
  .colorDot.active { border-color: #fff; }
  .toolBtn, .brushBtn, .zoomBtn {
    background: #3a3a3c; color: #fff; border: none; border-radius: 10px;
    padding: 8px 11px; font-size: 12.5px; flex-shrink: 0; white-space: nowrap;
  }
  .toolBtn.active, .brushBtn.active { background: #ff9500; color: #1c1c1e; font-weight: 600; }
  #sizeSlider { width: 60px; flex-shrink: 0; }
  #zoomLabel { color: #ccc; font-size: 12px; width: 42px; text-align: center; }
  #footer {
    text-align: center; font-size: 11px; color: #8e8e93;
    padding: 4px; background: #2c2c2e;
  }
  #autosaveNote {
    font-size: 10px; color: #6e6e73; text-align: center; padding: 2px 8px 6px;
    background: #2c2c2e;
  }

  .sheetOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  .sheetOverlay.open { display: flex; }
  .sheetCard {
    background: #2c2c2e; border-radius: 14px; padding: 16px;
    width: 300px; max-height: 80vh; overflow-y: auto; color: #fff;
  }
  .sheetCard h3 { margin: 0 0 10px; font-size: 15px; }
  .saveOpt {
    display: block; width: 100%; margin-bottom: 8px;
    background: #3a3a3c; color: #fff; border: none; border-radius: 10px;
    padding: 10px; font-size: 14px; text-align: left;
  }
  .saveOpt small { display: block; color: #8e8e93; font-size: 11px; margin-top: 2px; }
  .sheetClose {
    width: 100%; margin-top: 4px; background: none; color: #ff9500;
    border: none; padding: 8px; font-size: 14px;
  }

  .layerRow {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 4px; border-radius: 8px; margin-bottom: 4px;
  }
  .layerRow.active { background: #3a3a3c; }
  .visBtn { background: none; border: none; color: #fff; font-size: 15px; width: 22px; flex-shrink: 0; }
  .layerName { flex: 1; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opacityRange { width: 46px; flex-shrink: 0; }
  .blendSelect { font-size: 11px; background: #1c1c1e; color: #fff; border: none; border-radius: 6px; width: 62px; flex-shrink: 0; }
  .upBtn, .downBtn { background: #1c1c1e; color: #fff; border: none; border-radius: 6px; width: 22px; height: 22px; font-size: 11px; flex-shrink: 0; }
  .layerActions { display: flex; gap: 6px; margin-top: 8px; }
  .layerActions .saveOpt { flex: 1; margin-bottom: 0; text-align: center; font-size: 12px; padding: 8px 4px; }
</style>
</head>
<body>
<div id="app">
  <div id="canvasWrap">
    <canvas id="canvas"></canvas>
  </div>

  <div id="autosaveNote">기기 저장: <span id="autosaveStatus">대기 중</span> ・ 클라우드: <span id="cloudStatus">대기 중</span></div>

  <div id="zoomRow">
    <button class="zoomBtn" id="zoomOut">－</button>
    <span id="zoomLabel">100%</span>
    <button class="zoomBtn" id="zoomIn">＋</button>
    <button class="zoomBtn" id="zoomReset">원본</button>
    <button class="zoomBtn" id="layerBtn">레이어</button>
  </div>

  <div id="brushRow">
    <button class="brushBtn active" data-brush="pencil">연필</button>
    <button class="brushBtn" data-brush="oil">유화</button>
    <button class="brushBtn" data-brush="watercolor">수채화</button>
    <button class="brushBtn" data-brush="webtoon">웹툰펜</button>
    <button class="brushBtn" data-brush="marker">마커</button>
    <button class="brushBtn" data-brush="airbrush">에어브러시</button>
    <button class="brushBtn" data-brush="line">직선(정밀)</button>
    <button class="brushBtn" data-brush="fill">채우기</button>
  </div>
  <div id="toolbar">
    <div class="colorDot active" style="background:#000000" data-color="#000000"></div>
    <div class="colorDot" style="background:#ff3b30" data-color="#ff3b30"></div>
    <div class="colorDot" style="background:#ff9500" data-color="#ff9500"></div>
    <div class="colorDot" style="background:#ffcc00" data-color="#ffcc00"></div>
    <div class="colorDot" style="background:#34c759" data-color="#34c759"></div>
    <div class="colorDot" style="background:#007aff" data-color="#007aff"></div>
    <div class="colorDot" style="background:#5856d6" data-color="#5856d6"></div>
    <div class="colorDot" style="background:#a2845e" data-color="#a2845e"></div>
    <div class="colorDot" style="background:#ffffff;border-color:#666" data-color="#ffffff"></div>
    <input type="range" id="sizeSlider" min="1" max="60" value="8">
    <button class="toolBtn" id="eraserBtn">지우개</button>
    <button class="toolBtn" id="undoBtn">되돌리기</button>
    <button class="toolBtn" id="clearBtn">레이어지우기</button>
    <button class="toolBtn" id="saveBtn">저장</button>
  </div>
  <div id="footer">심상현</div>

  <div id="saveMenu" class="sheetOverlay">
    <div class="sheetCard">
      <h3>저장 방식 선택</h3>
      <button class="saveOpt" data-fmt="png">PNG로 저장<small>배경 투명 유지, 원본 화질</small></button>
      <button class="saveOpt" data-fmt="jpeg">JPEG로 저장<small>흰 배경, 용량 작음</small></button>
      <button class="saveOpt" data-fmt="webp">WebP로 저장<small>고화질 + 작은 용량</small></button>
      <button class="saveOpt" id="shareOpt">공유하기<small>카톡 등으로 바로 보내기</small></button>
      <button class="sheetClose" id="closeSaveMenu">닫기</button>
    </div>
  </div>

  <div id="layerMenu" class="sheetOverlay">
    <div class="sheetCard">
      <h3>레이어 (위쪽이 상단 레이어)</h3>
      <div id="layerList"></div>
      <div class="layerActions">
        <button class="saveOpt" id="addLayerBtn">+ 새 레이어</button>
        <button class="saveOpt" id="dupLayerBtn">복제</button>
        <button class="saveOpt" id="delLayerBtn">삭제</button>
      </div>
      <button class="sheetClose" id="closeLayerMenu">닫기</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const dctx = canvas.getContext('2d'); // display/compositing context only
const wrap = document.getElementById('canvasWrap');
const autosaveStatus = document.getElementById('autosaveStatus');
const cloudStatus = document.getElementById('cloudStatus');

// ---------- Firebase (레이어 구조 클라우드 저장) ----------

const firebaseConfig = {
  apiKey: "AIzaSyCH642xrwFpiA1IUumcBl0BgyqFfObTvPs",
  authDomain: "ssh-sketch.firebaseapp.com",
  projectId: "ssh-sketch",
  storageBucket: "ssh-sketch.firebasestorage.app",
  messagingSenderId: "162374226266",
  appId: "1:162374226266:web:a663cc5971e5261544e363",
  measurementId: "G-91F871305Z"
};

let db = null;
let docRef = null;
let cloudTimer = null;

try {
  if (typeof firebase !== 'undefined') {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    docRef = db.collection('sketches').doc('current');
  }
} catch (e) {
  db = null;
}

function layerThumbDataURL(layer, maxDim) {
  const w = layer.el.width, h = layer.el.height;
  const scale = Math.min(1, maxDim / Math.max(w, h));
  const tw = Math.max(1, Math.round(w * scale));
  const th = Math.max(1, Math.round(h * scale));
  const t = document.createElement('canvas');
  t.width = tw; t.height = th;
  t.getContext('2d').drawImage(layer.el, 0, 0, w, h, 0, 0, tw, th);
  return t.toDataURL('image/png');
}

function scheduleCloudSave() {
  if (!docRef) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(saveToCloud, 1500);
}

async function saveToCloud() {
  if (!docRef) return;
  try {
    cloudStatus.textContent = '저장 중...';
    const payload = {
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      layers: layers.map(l => ({
        name: l.name,
        opacity: l.opacity,
        blend: l.blend,
        visible: l.visible,
        dataUrl: layerThumbDataURL(l, 1400)
      }))
    };
    await docRef.set(payload);
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    cloudStatus.textContent = hh + ':' + mm + ' 동기화됨';
  } catch (e) {
    cloudStatus.textContent = '클라우드 저장 실패';
  }
}

async function loadFromCloud() {
  if (!docRef) return false;
  try {
    cloudStatus.textContent = '불러오는 중...';
    const snap = await docRef.get();
    if (!snap.exists) { cloudStatus.textContent = '저장된 작업 없음'; return false; }
    const data = snap.data();
    if (!data.layers || !data.layers.length) { cloudStatus.textContent = '저장된 작업 없음'; return false; }

    layers = [];
    activeLayerIndex = 0;
    for (const Ld of data.layers) {
      await new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          addLayer(Ld.name);
          const newLayer = layers[activeLayerIndex];
          newLayer.opacity = Ld.opacity;
          newLayer.blend = Ld.blend;
          newLayer.visible = Ld.visible;
          newLayer.ctx.setTransform(1, 0, 0, 1, 0, 0);
          newLayer.ctx.clearRect(0, 0, newLayer.el.width, newLayer.el.height);
          newLayer.ctx.drawImage(img, 0, 0, newLayer.el.width, newLayer.el.height);
          newLayer.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          resolve();
        };
        img.onerror = resolve;
        img.src = Ld.dataUrl;
      });
    }
    activeLayerIndex = layers.length - 1;
    ctx = layers[activeLayerIndex].ctx;
    history = [];
    renderLayerPanel();
    compositeLayers();
    cloudStatus.textContent = '클라우드에서 불러옴';
    return true;
  } catch (e) {
    cloudStatus.textContent = '클라우드 불러오기 실패';
    return false;
  }
}

let ctx = null; // always points to the ACTIVE layer's 2D context
let layers = []; // { el, ctx, opacity, blend, visible, name }
let activeLayerIndex = 0;

let history = [];
let currentColor = '#000000';
let currentSize = 8;
let isEraser = false;
let brushType = 'pencil';
let drawing = false;
let p0 = null, p1 = null;
let lastT = 0;
let lastPressure = 0.5;
let dpr = window.devicePixelRatio || 1;
let zoomLevel = 1;
let cssWidth = 0, cssHeight = 0;
let memoryDraft = null;
let autosaveTimer = null;
let airbrushTimer = null;
let storageAvailable = false;

try {
  localStorage.setItem('__sketch_test__', '1');
  localStorage.removeItem('__sketch_test__');
  storageAvailable = true;
} catch (e) {
  storageAvailable = false;
}

function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}

// ---------- Layer management ----------

function addLayer(name, copyFromEl) {
  const el = document.createElement('canvas');
  el.width = canvas.width;
  el.height = canvas.height;
  const lctx = el.getContext('2d');
  if (copyFromEl) {
    lctx.drawImage(copyFromEl, 0, 0);
  }
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lctx.lineCap = 'round';
  lctx.lineJoin = 'round';
  const layer = { el, ctx: lctx, opacity: 1, blend: 'source-over', visible: true, name };
  const insertIdx = layers.length === 0 ? 0 : activeLayerIndex + 1;
  layers.splice(insertIdx, 0, layer);
  activeLayerIndex = insertIdx;
  ctx = layer.ctx;
  history = [];
  renderLayerPanel();
  compositeLayers();
}

function compositeLayers() {
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.clearRect(0, 0, canvas.width, canvas.height);
  dctx.fillStyle = '#ffffff';
  dctx.fillRect(0, 0, canvas.width, canvas.height);
  for (const layer of layers) {
    if (!layer.visible) continue;
    dctx.globalAlpha = layer.opacity;
    dctx.globalCompositeOperation = layer.blend;
    dctx.drawImage(layer.el, 0, 0);
  }
  dctx.globalAlpha = 1;
  dctx.globalCompositeOperation = 'source-over';
}

function renderLayerPanel() {
  const list = document.getElementById('layerList');
  list.innerHTML = '';
  for (let i = layers.length - 1; i >= 0; i--) {
    const layer = layers[i];
    const row = document.createElement('div');
    row.className = 'layerRow' + (i === activeLayerIndex ? ' active' : '');
    row.innerHTML =
      '<button class="visBtn" data-idx="' + i + '">' + (layer.visible ? '\ud83d\udc41' : '\ud83d\udeab') + '</button>' +
      '<span class="layerName" data-idx="' + i + '">' + layer.name + '</span>' +
      '<input type="range" class="opacityRange" data-idx="' + i + '" min="0" max="100" value="' + Math.round(layer.opacity * 100) + '">' +
      '<select class="blendSelect" data-idx="' + i + '">' +
        '<option value="source-over"' + (layer.blend === 'source-over' ? ' selected' : '') + '>표준</option>' +
        '<option value="multiply"' + (layer.blend === 'multiply' ? ' selected' : '') + '>곱하기</option>' +
        '<option value="screen"' + (layer.blend === 'screen' ? ' selected' : '') + '>스크린</option>' +
        '<option value="overlay"' + (layer.blend === 'overlay' ? ' selected' : '') + '>오버레이</option>' +
        '<option value="darken"' + (layer.blend === 'darken' ? ' selected' : '') + '>어둡게</option>' +
        '<option value="lighten"' + (layer.blend === 'lighten' ? ' selected' : '') + '>밝게</option>' +
      '</select>' +
      '<button class="upBtn" data-idx="' + i + '">\u2191</button>' +
      '<button class="downBtn" data-idx="' + i + '">\u2193</button>';
    list.appendChild(row);
  }
  bindLayerRowEvents();
}

function bindLayerRowEvents() {
  document.querySelectorAll('.layerName').forEach(el => {
    el.addEventListener('click', () => {
      activeLayerIndex = parseInt(el.dataset.idx);
      ctx = layers[activeLayerIndex].ctx;
      history = [];
      renderLayerPanel();
    });
  });
  document.querySelectorAll('.visBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.idx);
      layers[i].visible = !layers[i].visible;
      renderLayerPanel();
      compositeLayers();
    });
  });
  document.querySelectorAll('.opacityRange').forEach(el => {
    el.addEventListener('input', () => {
      const i = parseInt(el.dataset.idx);
      layers[i].opacity = parseInt(el.value) / 100;
      compositeLayers();
    });
  });
  document.querySelectorAll('.blendSelect').forEach(el => {
    el.addEventListener('change', () => {
      const i = parseInt(el.dataset.idx);
      layers[i].blend = el.value;
      compositeLayers();
    });
  });
  document.querySelectorAll('.upBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.idx);
      if (i >= layers.length - 1) return;
      const tmp = layers[i]; layers[i] = layers[i + 1]; layers[i + 1] = tmp;
      if (activeLayerIndex === i) activeLayerIndex = i + 1;
      else if (activeLayerIndex === i + 1) activeLayerIndex = i;
      renderLayerPanel();
      compositeLayers();
    });
  });
  document.querySelectorAll('.downBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.idx);
      if (i <= 0) return;
      const tmp = layers[i]; layers[i] = layers[i - 1]; layers[i - 1] = tmp;
      if (activeLayerIndex === i) activeLayerIndex = i - 1;
      else if (activeLayerIndex === i - 1) activeLayerIndex = i;
      renderLayerPanel();
      compositeLayers();
    });
  });
}

const layerMenu = document.getElementById('layerMenu');
document.getElementById('layerBtn').addEventListener('click', () => layerMenu.classList.add('open'));
document.getElementById('closeLayerMenu').addEventListener('click', () => layerMenu.classList.remove('open'));
document.getElementById('addLayerBtn').addEventListener('click', () => {
  addLayer('레이어 ' + (layers.length + 1));
  scheduleAutosave();
});
document.getElementById('dupLayerBtn').addEventListener('click', () => {
  const src = layers[activeLayerIndex];
  addLayer(src.name + ' 복제', src.el);
  scheduleAutosave();
});
document.getElementById('delLayerBtn').addEventListener('click', () => {
  if (layers.length <= 1) return;
  layers.splice(activeLayerIndex, 1);
  activeLayerIndex = Math.max(0, activeLayerIndex - 1);
  ctx = layers[activeLayerIndex].ctx;
  history = [];
  renderLayerPanel();
  compositeLayers();
  scheduleAutosave();
});

// ---------- Canvas / display sizing (HiDPI) ----------

function resizeCanvas() {
  const rect = wrap.getBoundingClientRect();
  cssWidth = rect.width;
  cssHeight = rect.height;
  const newW = Math.round(cssWidth * dpr);
  const newH = Math.round(cssHeight * dpr);

  const temps = layers.map(l => {
    if (!l.el.width || !l.el.height) return null;
    const t = document.createElement('canvas');
    t.width = l.el.width;
    t.height = l.el.height;
    t.getContext('2d').drawImage(l.el, 0, 0);
    return t;
  });

  canvas.width = newW;
  canvas.height = newH;
  canvas.style.width = cssWidth + 'px';
  canvas.style.height = cssHeight + 'px';

  layers.forEach((l, i) => {
    l.el.width = newW;
    l.el.height = newH;
    l.ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (temps[i]) l.ctx.drawImage(temps[i], 0, 0, temps[i].width, temps[i].height, 0, 0, newW, newH);
    l.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    l.ctx.lineCap = 'round';
    l.ctx.lineJoin = 'round';
  });

  if (layers.length === 0) {
    addLayer('레이어 1');
    tryRestoreAutosave();
  }
  compositeLayers();
  applyZoom();
}
window.addEventListener('resize', resizeCanvas);

function applyZoom() {
  canvas.style.transform = 'scale(' + zoomLevel + ')';
  document.getElementById('zoomLabel').textContent = Math.round(zoomLevel * 100) + '%';
}

document.getElementById('zoomIn').addEventListener('click', () => {
  zoomLevel = Math.min(4, +(zoomLevel + 0.25).toFixed(2));
  applyZoom();
});
document.getElementById('zoomOut').addEventListener('click', () => {
  zoomLevel = Math.max(0.5, +(zoomLevel - 0.25).toFixed(2));
  applyZoom();
});
document.getElementById('zoomReset').addEventListener('click', () => {
  zoomLevel = 1;
  applyZoom();
});

function saveHistory() {
  history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (history.length > 20) history.shift();
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / zoomLevel,
    y: (e.clientY - rect.top) / zoomLevel
  };
}

// ---------- Brush renderers (curve-smoothed, pressure-aware, layer-safe eraser) ----------

function curvePoints(x0, y0, cx, cy, x1, y1, segments) {
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const mt = 1 - t;
    pts.push({
      x: mt * mt * x0 + 2 * mt * t * cx + t * t * x1,
      y: mt * mt * y0 + 2 * mt * t * cy + t * t * y1
    });
  }
  return pts;
}

function drawPencilCurve(x0, y0, cx, cy, x1, y1, pressure) {
  if (isEraser) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = currentColor;
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = (isEraser ? currentSize : currentSize * 0.5) * (0.4 + pressure * 0.9);
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(cx, cy, x1, y1);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

function drawOilCurve(x0, y0, cx, cy, x1, y1) {
  if (isEraser) { drawPencilCurve(x0, y0, cx, cy, x1, y1, 1); return; }
  const rgb = hexToRgb(currentColor);
  const pts = curvePoints(x0, y0, cx, cy, x1, y1, 6);
  ctx.globalCompositeOperation = 'multiply';
  const bristles = 6;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    for (let j = 0; j < bristles; j++) {
      const off = (Math.random() - 0.5) * currentSize * 0.9;
      const shade = 0.85 + Math.random() * 0.3;
      ctx.strokeStyle = 'rgba(' + (Math.min(255, rgb.r*shade)|0) + ',' + (Math.min(255, rgb.g*shade)|0) + ',' + (Math.min(255, rgb.b*shade)|0) + ',0.35)';
      ctx.lineWidth = currentSize * (0.25 + Math.random() * 0.3);
      ctx.beginPath();
      ctx.moveTo(a.x + nx * off, a.y + ny * off);
      ctx.lineTo(b.x + nx * off, b.y + ny * off);
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawWatercolorCurve(x0, y0, cx, cy, x1, y1) {
  if (isEraser) { drawPencilCurve(x0, y0, cx, cy, x1, y1, 1); return; }
  const rgb = hexToRgb(currentColor);
  const approxLen = Math.hypot(x1 - x0, y1 - y0) + Math.hypot(cx - x0, cy - y0);
  const steps = Math.max(2, Math.floor(approxLen / 3));
  const pts = curvePoints(x0, y0, cx, cy, x1, y1, steps);
  ctx.globalCompositeOperation = 'multiply';
  for (const pt of pts) {
    const px = pt.x + (Math.random() - 0.5) * currentSize * 0.3;
    const py = pt.y + (Math.random() - 0.5) * currentSize * 0.3;
    const r = currentSize * (0.9 + Math.random() * 0.5);
    const grad = ctx.createRadialGradient(px, py, 0, px, py, r);
    grad.addColorStop(0, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.10)');
    grad.addColorStop(0.7, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.06)');
    grad.addColorStop(1, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawWebtoonCurve(x0, y0, cx, cy, x1, y1, speed, pressure) {
  if (isEraser) { drawPencilCurve(x0, y0, cx, cy, x1, y1, pressure); return; }
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = currentColor;
  ctx.globalAlpha = 1;
  const speedFactor = 1 - Math.min(0.7, speed * 0.04);
  const w = Math.max(0.6, currentSize * 0.5 * speedFactor * (0.5 + pressure * 0.8));
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(cx, cy, x1, y1);
  ctx.stroke();
}

function drawMarkerCurve(x0, y0, cx, cy, x1, y1) {
  if (isEraser) { drawPencilCurve(x0, y0, cx, cy, x1, y1, 1); return; }
  ctx.globalCompositeOperation = 'multiply';
  ctx.strokeStyle = currentColor;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = currentSize * 1.3;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(cx, cy, x1, y1);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function sprayAirbrush(x, y) {
  const dots = 10;
  ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
  const rgb = isEraser ? null : hexToRgb(currentColor);
  for (let i = 0; i < dots; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * currentSize * 0.8;
    const px = x + Math.cos(angle) * r;
    const py = y + Math.sin(angle) * r;
    const dotR = Math.random() * 1.8 + 0.4;
    ctx.fillStyle = isEraser ? 'rgba(0,0,0,0.10)' : ('rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.10)');
    ctx.beginPath();
    ctx.arc(px, py, dotR, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function stampDot(x, y, pressure) {
  ctx.globalAlpha = 1;
  if (isEraser) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = currentColor;
  }
  const base = (brushType === 'pencil' || brushType === 'webtoon') ? currentSize * 0.25 : currentSize * 0.4;
  const r = base * (0.5 + pressure * 0.8);
  ctx.beginPath();
  ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

// ---------- Flood fill (active layer only) ----------

function floodFill(cssX, cssY, fillHex, erase) {
  const startX = Math.round(cssX * dpr);
  const startY = Math.round(cssY * dpr);
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  if (startX < 0 || startY < 0 || startX >= w || startY >= h) return;
  const idx0 = (startY * w + startX) * 4;
  const target = [data[idx0], data[idx0+1], data[idx0+2], data[idx0+3]];
  const fill = erase ? { r: 0, g: 0, b: 0 } : hexToRgb(fillHex);
  const fillA = erase ? 0 : 255;
  const tol = 40;
  function matches(i) {
    return Math.abs(data[i]-target[0]) <= tol &&
           Math.abs(data[i+1]-target[1]) <= tol &&
           Math.abs(data[i+2]-target[2]) <= tol &&
           Math.abs(data[i+3]-target[3]) <= tol;
  }
  if (target[0] === fill.r && target[1] === fill.g && target[2] === fill.b && target[3] === fillA) return;
  const stack = [[startX, startY]];
  const visited = new Uint8Array(w * h);
  while (stack.length) {
    const pt = stack.pop();
    const x = pt[0], y = pt[1];
    if (x < 0 || y < 0 || x >= w || y >= h) continue;
    const vIdx = y * w + x;
    if (visited[vIdx]) continue;
    const i = vIdx * 4;
    if (!matches(i)) continue;
    visited[vIdx] = 1;
    data[i] = fill.r; data[i+1] = fill.g; data[i+2] = fill.b; data[i+3] = fillA;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imgData, 0, 0);
}

// ---------- Autosave (flattened composite; in-memory always, localStorage when available) ----------

function scheduleAutosave() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(doAutosave, 800);
  scheduleCloudSave();
}

function doAutosave() {
  try {
    const dataUrl = canvas.toDataURL('image/png');
    memoryDraft = dataUrl;
    if (storageAvailable) localStorage.setItem('sketchAutosave', dataUrl);
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    autosaveStatus.textContent = hh + ':' + mm + ' 저장됨' + (storageAvailable ? '' : ' (이번 세션에만)');
  } catch (e) {
    autosaveStatus.textContent = '자동 저장 실패';
  }
}

function tryRestoreAutosave() {
  let dataUrl = null;
  if (storageAvailable) {
    try { dataUrl = localStorage.getItem('sketchAutosave'); } catch (e) {}
  }
  if (!dataUrl) dataUrl = memoryDraft;
  if (!dataUrl) return;
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, cssWidth, cssHeight);
    compositeLayers();
    autosaveStatus.textContent = '이전 그림 복원됨 (평면 이미지, 레이어는 새로 시작)';
  };
  img.src = dataUrl;
}

// ---------- Pointer input (mouse / touch / pen, with pressure) ----------

function startDraw(e) {
  e.preventDefault();
  if (canvas.setPointerCapture && e.pointerId != null) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
  const p = getPos(e);
  const pressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;

  if (brushType === 'fill') {
    saveHistory();
    floodFill(p.x, p.y, currentColor, isEraser);
    compositeLayers();
    scheduleAutosave();
    return;
  }

  saveHistory();
  drawing = true;
  p0 = p1 = p;
  lastPressure = pressure;
  lastT = Date.now();

  if (brushType === 'airbrush') {
    sprayAirbrush(p.x, p.y);
    compositeLayers();
    clearInterval(airbrushTimer);
    airbrushTimer = setInterval(() => { sprayAirbrush(p1.x, p1.y); compositeLayers(); }, 45);
  } else if (brushType === 'line') {
    compositeLayers();
  } else {
    stampDot(p.x, p.y, pressure);
    compositeLayers();
  }
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();
  const p2 = getPos(e);
  const pressure = (e.pressure && e.pressure > 0) ? e.pressure : lastPressure;
  const now = Date.now();
  const dt = Math.max(1, now - lastT);
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const speed = dist / dt;

  if (brushType === 'line') {
    const snapshot = history[history.length - 1];
    if (snapshot) ctx.putImageData(snapshot, 0, 0);
    ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
    ctx.strokeStyle = isEraser ? 'rgba(0,0,0,1)' : currentColor;
    ctx.lineWidth = currentSize * 0.5;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    p1 = p2; lastT = now; lastPressure = pressure;
    compositeLayers();
    return;
  }

  if (brushType === 'airbrush') {
    sprayAirbrush(p2.x, p2.y);
    p1 = p2; lastT = now; lastPressure = pressure;
    compositeLayers();
    return;
  }

  const midA = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
  const midB = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

  if (brushType === 'oil') drawOilCurve(midA.x, midA.y, p1.x, p1.y, midB.x, midB.y);
  else if (brushType === 'watercolor') drawWatercolorCurve(midA.x, midA.y, p1.x, p1.y, midB.x, midB.y);
  else if (brushType === 'webtoon') drawWebtoonCurve(midA.x, midA.y, p1.x, p1.y, midB.x, midB.y, speed, pressure);
  else if (brushType === 'marker') drawMarkerCurve(midA.x, midA.y, p1.x, p1.y, midB.x, midB.y);
  else drawPencilCurve(midA.x, midA.y, p1.x, p1.y, midB.x, midB.y, pressure);

  p0 = p1; p1 = p2; lastT = now; lastPressure = pressure;
  compositeLayers();
}

function endDraw() {
  if (airbrushTimer) { clearInterval(airbrushTimer); airbrushTimer = null; }
  if (drawing) scheduleAutosave();
  drawing = false; p0 = p1 = null;
}

canvas.addEventListener('pointerdown', startDraw);
canvas.addEventListener('pointermove', draw);
canvas.addEventListener('pointerup', endDraw);
canvas.addEventListener('pointercancel', endDraw);
canvas.addEventListener('pointerleave', endDraw);

document.querySelectorAll('.colorDot').forEach(dot => {
  dot.addEventListener('click', () => {
    document.querySelectorAll('.colorDot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
    currentColor = dot.dataset.color;
    isEraser = false;
    document.getElementById('eraserBtn').classList.remove('active');
  });
});

document.querySelectorAll('.brushBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.brushBtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    brushType = btn.dataset.brush;
  });
});

document.getElementById('sizeSlider').addEventListener('input', (e) => {
  currentSize = parseInt(e.target.value);
});

document.getElementById('eraserBtn').addEventListener('click', (e) => {
  isEraser = !isEraser;
  e.target.classList.toggle('active', isEraser);
});

document.getElementById('undoBtn').addEventListener('click', () => {
  if (history.length === 0) return;
  const imgData = history.pop();
  ctx.putImageData(imgData, 0, 0);
  compositeLayers();
  scheduleAutosave();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  saveHistory();
  ctx.clearRect(0, 0, cssWidth, cssHeight);
  compositeLayers();
  scheduleAutosave();
});

// ---------- Save menu (multiple formats + share) ----------

const saveMenu = document.getElementById('saveMenu');
document.getElementById('saveBtn').addEventListener('click', () => saveMenu.classList.add('open'));
document.getElementById('closeSaveMenu').addEventListener('click', () => saveMenu.classList.remove('open'));

document.querySelectorAll('.saveOpt[data-fmt]').forEach(btn => {
  btn.addEventListener('click', () => {
    const fmt = btn.dataset.fmt;
    let ext = 'png';
    if (fmt === 'jpeg') {
      ext = 'jpg';
      const flat = document.createElement('canvas');
      flat.width = canvas.width; flat.height = canvas.height;
      const fctx = flat.getContext('2d');
      fctx.fillStyle = '#ffffff';
      fctx.fillRect(0, 0, flat.width, flat.height);
      fctx.drawImage(canvas, 0, 0);
      const link = document.createElement('a');
      link.download = 'sketch-' + Date.now() + '.' + ext;
      link.href = flat.toDataURL('image/jpeg', 0.92);
      link.click();
      saveMenu.classList.remove('open');
      return;
    }
    let mime = 'image/png', quality;
    if (fmt === 'webp') { mime = 'image/webp'; ext = 'webp'; quality = 0.92; }
    const link = document.createElement('a');
    link.download = 'sketch-' + Date.now() + '.' + ext;
    link.href = canvas.toDataURL(mime, quality);
    link.click();
    saveMenu.classList.remove('open');
  });
});

document.getElementById('shareOpt').addEventListener('click', async () => {
  saveMenu.classList.remove('open');
  try {
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const file = new File([blob], 'sketch-' + Date.now() + '.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '스케치' });
    } else {
      const link = document.createElement('a');
      link.download = 'sketch-' + Date.now() + '.png';
      link.href = URL.createObjectURL(blob);
      link.click();
    }
  } catch (e) {}
});

// ---------- Init ----------
resizeCanvas();
loadFromCloud();
</script>
</body>
